[workspace]
resolver = "3"
members = [
    "schema-diagram-generator",
    "schema-diff",
    "schema-installer",
    "schema-migration-generator",
    "schema-model",
    "schema-parser",
    "schema-reverse-engineer",
    "schema-sql-generator",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
authors = ["Jeff Stano <jeff@stano.com>"]
description = "A set of tools to manage relational database schemas"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jstano/schema-rs"
homepage = "https://github.com/jstano/schema-rs"
readme = "README.md"
keywords = ["schema"]

[workspace.dependencies]
schema-diagram-generator = { version = "0.7.0", path = "schema-diagram-generator" }
schema-diff = { version = "0.7.0", path = "schema-diff" }
schema-installer = { version = "0.7.0", path = "schema-installer" }
schema-migration-generator = { version = "0.7.0", path = "schema-migration-generator" }
schema-model = { version = "0.7.0", path = "schema-model" }
schema-parser = { version = "0.7.0", path = "schema-parser" }
schema-reverse-engineer = { version = "0.7.0", path = "schema-reverse-engineer" }
schema-sql-generator = { version = "0.7.0", path = "schema-sql-generator" }

# Xcode 27.1's linker writes a proc-macro dylib with a mis-aligned LINKEDIT string pool when
# cargo's default release `strip = "debuginfo"` is applied, and rustc then fails to dlopen it.
# Build scripts and proc-macros (the build-override profile) never ship, so don't strip them.
[profile.release.build-override]
strip = "none"
