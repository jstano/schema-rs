name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # These tests start PostgreSQL via testcontainers and silently skip
      # without RUN_DOCKER_TESTS, so run them explicitly with output shown.
      - run: cargo test -p schema-installer --test postgres_integration_tests -- --nocapture
      - run: cargo test -p schema-reverse-engineer --test postgres_integration_tests -- --nocapture
